<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::#page-content}, 'Áreas')}"><body>
<section id="page-content" class="management" data-management>
<link rel="stylesheet" th:href="@{/css/management.css}"/>
<div class="page-header"><div><h1 class="page-title">Áreas</h1><p class="page-subtitle">Organizá las zonas de trabajo de tu equipo.</p></div><button type="button" class="btn-primary-dark" data-open-create hidden><i class="bi bi-plus-lg" aria-hidden="true"></i>Nueva área</button></div>
<div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
<div class="card-dark"><div class="management-tools" hidden><input type="search" data-search placeholder="Buscar por nombre" aria-label="Buscar por nombre"/><div class="management-filters"><button type="button" data-filter="" aria-pressed="true">Todos <b></b></button></div><span data-count role="status" aria-live="polite"></span></div>
<table class="table-dark-custom"><thead><tr><th>Nombre</th><th>Descripción</th><th>Personal activo</th><th>Acciones</th></tr></thead><tbody><tr th:each="area : ${areas}" data-row th:attr="data-name=${area.nombre},data-category='' "><td><strong th:text="${area.nombre}"></strong></td><td data-label="Descripción" th:text="${#strings.isEmpty(area.descripcion) ? 'Sin descripción' : area.descripcion}"></td><td data-label="Personal activo" th:text="${personalPorArea.getOrDefault(area.id, 0)} + ' empleados'"></td><td><div class="row-actions"><a class="btn-edit" th:href="@{/areas/editar/{id}(id=${area.id})}" th:attr="aria-label=${'Editar ' + area.nombre}"><i class="bi bi-pencil" aria-hidden="true"></i> Editar</a><form th:action="@{/areas/eliminar/{id}(id=${area.id})}" method="post" class="m-0"><button type="submit" class="btn-danger-ghost" th:attr="aria-label=${'Eliminar ' + area.nombre},title=${'Eliminar ' + area.nombre}" onclick="return confirm('¿Eliminar esta área?')"><i class="bi bi-trash" aria-hidden="true"></i></button></form></div></td></tr></tbody></table>
<p class="empty-state" data-empty th:hidden="${!#lists.isEmpty(areas)}">Todavía no hay registros. Usá «Nueva área» para comenzar.</p></div>
<div data-create-panel class="create-panel"><h2 id="create-title">Nueva área</h2><form th:action="@{/areas/guardar}" th:object="${nuevaArea}" method="post" class="form-dark">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input id="nombre" type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Tortas" required/>
                        </div>
                        <div class="mb-4">
                            <label for="descripcion" class="form-label">Descripción <span style="color:var(--text-muted)">(opcional)</span></label>
                            <input id="descripcion" type="text" class="form-control" th:field="*{descripcion}" placeholder="Breve descripción"/>
                        </div>
                        <button type="submit" class="btn-primary-dark w-100">
                            <i class="bi bi-plus-lg"></i> Guardar área
                        </button>
                    </form><button type="button" class="btn-ghost" data-close-create hidden>Cancelar</button></div>
<script th:src="@{/js/management.js}"></script>
</section></body></html>

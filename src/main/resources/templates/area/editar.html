<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#page-content}, 'Editar Área')}">
<body>

<div id="page-content" th:fragment="content">
    
    <div class="container-fluid p-0">
        
        <div class="page-header fade-up mb-4">
            <h1 class="page-title">Editar Área</h1>
            <p class="page-subtitle">Modificá los detalles y configuraciones del área seleccionada</p>
        </div>

        <div class="row fade-up fade-up-1">
            <div class="col-12 col-xl-6">
                <div class="card-dark">
                    <div class="card-header-dark">
                        <span class="card-title-dark">
                            <i class="bi bi-pencil-square me-2" style="color:var(--accent)"></i>Actualizar Información
                        </span>
                    </div>
                    <div class="card-body-dark">
                        
                        <form th:action="@{/areas/editar/{id}(id=${area.id})}" 
                              th:object="${area}" 
                              method="post" 
                              class="form-dark">
                            
                            <div class="mb-3">
                                <label class="form-label">Nombre del área</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required/>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Descripción</label>
                                <input type="text" class="form-control" th:field="*{descripcion}"/>
                            </div>

                            <div class="d-flex gap-2 justify-content-end mt-3">
                                <button type="submit" class="btn-primary-dark">
                                    <i class="bi bi-save"></i> Actualizar
                                </button>
                                <a th:href="@{/areas}" class="btn-ghost">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>

</body>
</html>

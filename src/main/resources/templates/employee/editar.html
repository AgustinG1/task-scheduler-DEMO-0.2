<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#page-content}, 'Editar Empleado')}">
<body>

<div id="page-content" th:fragment="content">

    <div class="container-fluid p-0">
        <div class="page-header fade-up mb-4">
            <div>
                <h1 class="page-title">Editar Empleado</h1>
                <p class="page-subtitle">Modificá los datos del empleado seleccionado</p>
            </div>
            <a th:href="@{/employees}" class="btn-ghost">
                <i class="bi bi-arrow-left"></i> Volver a Empleados
            </a>
        </div>

        <div class="row justify-content-center fade-up fade-up-1">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card-dark">
                    <div class="card-header-dark">
                        <span class="card-title-dark">
                            <i class="bi bi-pencil-square me-2" style="color:var(--accent)"></i>Datos del Empleado
                        </span>
                    </div>
                    <div class="card-body-dark">
                        <form th:action="@{/employees/editar/{id}(id=${employee.id})}" method="post" class="form-dark">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" th:value="${employee.name}" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Apellido</label>
                                <input type="text" name="apellido" th:value="${employee.apellido}" class="form-control"/>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Área</label>
                                <select name="area.id" class="form-select" required>
                                    <option th:each="area : ${areas}"
                                            th:value="${area.id}"
                                            th:text="${area.nombre}"
                                            th:selected="${area.id == employee.area.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/employees}" class="btn-ghost">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                                <button type="submit" class="btn-primary-dark">
                                    <i class="bi bi-check2-circle"></i> Actualizar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>

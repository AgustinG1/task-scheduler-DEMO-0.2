<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#page-content}, 'Empleados')}">
<body>

<div id="page-content" th:fragment="content">
    
    <div class="container-fluid p-0">
        <div class="page-header fade-up mb-4">
            <h1 class="page-title">Gestión de Empleados</h1>
            <p class="page-subtitle">Administrá al personal y asigná sus áreas correspondientes</p>
        </div>

        <div class="row g-4">
            <div class="col-12 col-xl-4 fade-up fade-up-1">
                <div class="card-dark">
                    <div class="card-header-dark">
                        <span class="card-title-dark">
                            <i class="bi bi-person-plus me-2" style="color:var(--accent)"></i>Nuevo Empleado
                        </span>
                    </div>
                    <div class="card-body-dark">
                        <!-- CAMBIO: no usar th:field, usar name y value -->
                        <form th:action="@{/employees/guardar}" method="post" class="form-dark">
                            <div class="mb-3">
                                <label class="form-label">Nombre del empleado</label>
                                <input type="text" name="nombre" class="form-control" placeholder="Ej: Pepe Z" required/>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Área asignada</label>
                                <select name="area.id" class="form-select" required>
                                    <option value="" disabled selected>-- Seleccionar área --</option>
                                    <option th:each="area : ${areas}" 
                                            th:value="${area.id}" 
                                            th:text="${area.nombre}">
                                    </option>
                                </select>
                            </div>
                            <button type="submit" class="btn-primary-dark w-100 justify-content-center">
                                <i class="bi bi-check2-circle"></i> Guardar empleado
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-8 fade-up fade-up-2">
                <div class="card-dark">
                    <div class="card-header-dark">
                        <span class="card-title-dark">
                            <i class="bi bi-people me-2" style="color:var(--accent)"></i>Personal Registrado
                        </span>
                        <span style="font-size:12px; color:var(--text-muted); font-family:var(--font-mono)" th:text="${#lists.size(employees)} + ' empleados'"></span>
                    </div>
                    
                    <div th:if="${#lists.isEmpty(employees)}" class="empty-state">
                        <i class="bi bi-person-x"></i>
                        <p>Todavía no hay empleados registrados en el sistema</p>
                    </div>

                    <table th:unless="${#lists.isEmpty(employees)}" class="table-dark-custom">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Área</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
<tbody>
    <tr th:each="emp : ${employees}">
        <td style="color:var(--text-muted); font-family:var(--font-mono)" th:text="${emp.id}"></td>
        
        <td><span style="font-weight:600" th:text="${emp.name}"></span></td>
        
        <td>
            <span class="badge-general" th:text="${emp.area != null ? emp.area.nombre : 'Sin área'}"></span>
        </td>
        
        <td>
            <div class="d-flex gap-2">
                <a th:href="@{/employees/editar/{id}(id=${emp.id})}" class="btn-edit">
                    <i class="bi bi-pencil"></i>
                </a>
                <a th:href="@{/employees/eliminar/{id}(id=${emp.id})}" class="btn-danger-ghost"
                   onclick="return confirm('¿Eliminar este empleado?')">
                    <i class="bi bi-trash"></i>
                </a>
            </div>
        </td>
    </tr>
</tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

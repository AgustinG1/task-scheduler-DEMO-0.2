<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::#page-content}, 'Empleados')}"><body>
<section id="page-content" class="management" data-management>
<link rel="stylesheet" th:href="@{/css/management.css}"/>
<div class="page-header"><div><h1 class="page-title">Empleados</h1><p class="page-subtitle">El personal activo y el área a la que pertenece.</p></div><button type="button" class="btn-primary-dark" data-open-create hidden><i class="bi bi-plus-lg" aria-hidden="true"></i>Nuevo empleado</button></div>
<div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
<div class="card-dark"><div class="management-tools" hidden><input type="search" data-search placeholder="Buscar por nombre" aria-label="Buscar por nombre"/><div class="management-filters"><button type="button" data-filter="" aria-pressed="true">Todos <b></b></button><button type="button" th:each="area : ${areas}" th:attr="data-filter=${area.id}" aria-pressed="false"><span th:text="${area.nombre}"></span> <b></b></button><button type="button" data-filter="none" aria-pressed="false">Sin área <b></b></button></div><span data-count role="status" aria-live="polite"></span></div>
<table class="table-dark-custom"><thead><tr><th>Nombre</th><th>Área</th><th>Acciones</th></tr></thead><tbody><tr th:each="emp : ${employees}" data-row th:attr="data-name=${emp.name},data-category=${emp.area != null ? emp.area.id : 'none'}"><td><span class="person"><span class="initial" aria-hidden="true" th:text="${#strings.isEmpty(emp.name) ? '?' : #strings.toUpperCase(#strings.substring(emp.name,0,1))}"></span><strong th:text="${emp.name}"></strong></span></td><td data-label="Área"><span class="badge-general" th:text="${emp.area != null ? emp.area.nombre : 'Sin área'}"></span></td><td><div class="row-actions"><a class="btn-edit" th:href="@{/employees/editar/{id}(id=${emp.id})}" th:attr="aria-label=${'Editar a ' + emp.name},title=${'Editar a ' + emp.name}"><i class="bi bi-pencil" aria-hidden="true"></i></a><form th:action="@{/employees/desactivar/{id}(id=${emp.id})}" method="post" class="m-0"><button class="btn-danger-ghost" th:attr="aria-label=${'Retirar a ' + emp.name},title=${'Retirar a ' + emp.name}" onclick="return confirm('¿Retirar este empleado del personal activo? Sus asignaciones históricas se conservarán.')"><i class="bi bi-person-dash" aria-hidden="true"></i></button></form></div></td></tr></tbody></table>
<p class="empty-state" data-empty th:hidden="${!#lists.isEmpty(employees)}">Todavía no hay registros. Usá «Nuevo empleado» para comenzar.</p></div>
<div data-create-panel class="create-panel"><h2 id="create-title">Nuevo empleado</h2><form th:action="@{/employees/guardar}" method="post" class="form-dark">
                            <div class="mb-3">
                                <label for="create-field-1" class="form-label">Nombre del empleado</label>
                                <input id="create-field-1" type="text" name="nombre" class="form-control" placeholder="Ej: Pepe Z" required/>
                            </div>
                            <div class="mb-4">
                                <label for="create-field-2" class="form-label">Área asignada</label>
                                <select id="create-field-2" name="area.id" class="form-select" required>
                                    <option value="" disabled selected>-- Seleccionar área --</option>
                                    <option th:each="area : ${areas}" 
                                            th:value="${area.id}" 
                                            th:text="${area.nombre}">
                                    </option>
                                </select>
                            </div>
                            <button type="submit" class="btn-primary-dark w-100 justify-content-center">
                                <i class="bi bi-check2-circle"></i> Guardar empleado
                            </button>
                        </form><button type="button" class="btn-ghost" data-close-create hidden>Cancelar</button></div>
<script th:src="@{/js/management.js}"></script>
</section></body></html>

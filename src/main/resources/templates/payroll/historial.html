<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::#page-content}, 'Historial de Planillas')}">
<body>

<div id="page-content" th:fragment="content">
    
    <div class="container-fluid p-0">
        <div class="page-header fade-up mb-4">
            <h1 class="page-title">Historial de Planillas</h1>
            <p class="page-subtitle">Registro de todas las planillas generadas y archivadas</p>
        </div>

        <div class="card-dark fade-up fade-up-1">
            <div class="card-header-dark">
                <span class="card-title-dark">
                    <i class="bi bi-clock-history me-2" style="color:var(--accent)"></i>Archivos Históricos
                </span>
                <a th:href="@{/payroll}" class="btn-ghost" style="padding: 4px 12px;"><i class="bi bi-arrow-left me-1"></i> Volver</a>
            </div>
            
            <div th:if="${#lists.isEmpty(planillas)}" class="empty-state">
                <i class="bi bi-folder-x" style="font-size: 2rem;"></i>
                <p>No hay registro de planillas archivadas.</p>
            </div>

            <table th:unless="${#lists.isEmpty(planillas)}" class="table-dark-custom text-center">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha de Inicio</th>
                        <th>Fecha de Fin</th>
                        <th>Estado</th>
                        <th>Generada El</th>
                        <th>Acciones</th> </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${planillas}">
                        <td style="color:var(--text-muted); font-family:var(--font-mono)" th:text="'#' + ${p.id}"></td>
                        <td th:text="${p.startDate}"></td>
                        <td th:text="${p.endDate}"></td>
                        <td>
                            <span th:class="${p.status.name() == 'ACTIVE' ? 'badge-general' : 'badge-rest'}" 
                                  th:text="${p.status}"></span>
                        </td>
                        <td style="color:var(--text-secondary)" th:text="${#temporals.format(p.generatedAt, 'dd-MM-yyyy HH:mm')}"></td>
                        
                        <td style="display: flex; gap: 8px; justify-content: center;">
                            <a th:href="@{/api/payrolls/{id}/download(id=${p.id})}" class="btn-ghost" style="color: #10b981; padding: 6px 10px;" title="Descargar Matriz CSV">
                                <i class="bi bi-filetype-csv"></i>
                            </a>
                            
                            <a th:href="@{/payroll/eliminar/{id}(id=${p.id})}" class="btn-danger-ghost"
                               onclick="return confirm('¿Estás seguro de eliminar esta planilla? También se borrarán todos los turnos asignados a ella de forma permanente.')" title="Eliminar Planilla">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>

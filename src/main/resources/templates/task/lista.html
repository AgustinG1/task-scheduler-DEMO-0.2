<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::#page-content}, 'Tareas')}"><body>
<section id="page-content" class="management" data-management>
<link rel="stylesheet" th:href="@{/css/management.css}"/>
<div class="page-header"><div><h1 class="page-title">Tareas</h1><p class="page-subtitle">Definí las actividades y sus áreas autorizadas.</p></div><button type="button" class="btn-primary-dark" data-open-create hidden><i class="bi bi-plus-lg" aria-hidden="true"></i>Nueva tarea</button></div>
<div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
<div class="card-dark"><div class="management-tools" hidden><input type="search" data-search placeholder="Buscar por nombre" aria-label="Buscar por nombre"/><div class="management-filters"><button type="button" data-filter="" aria-pressed="true">Todos <b></b></button><button type="button" data-filter="GENERAL" aria-pressed="false">Generales <b></b></button><button type="button" data-filter="SPECIFIC" aria-pressed="false">Específicas <b></b></button></div><span data-count role="status" aria-live="polite"></span></div>
<table class="table-dark-custom"><thead><tr><th>Nombre</th><th>Tipo</th><th>Área autorizada</th><th>Acciones</th></tr></thead><tbody><tr th:each="task : ${tasks}" data-row th:attr="data-name=${task.name},data-category=${task.type}"><td><strong th:text="${task.name}"></strong></td><td data-label="Tipo"><span class="badge-general" th:text="${task.type != null and task.type.name() == 'GENERAL' ? 'General' : 'Específica'}"></span></td><td data-label="Área autorizada"><span th:if="${task.type != null and task.type.name() == 'GENERAL'}">Todas las áreas</span><th:block th:unless="${task.type != null and task.type.name() == 'GENERAL'}"><span th:if="${#lists.isEmpty(task.authorizedAreas)}">Sin área autorizada</span><span th:each="link, stat : ${task.authorizedAreas}" th:text="${link.area.nombre + (stat.last ? '' : ', ')}"></span></th:block></td><td><div class="row-actions"><a class="btn-edit" th:href="@{/tasks/editar/{id}(id=${task.id})}" th:attr="aria-label=${'Editar ' + task.name},title=${'Editar ' + task.name}"><i class="bi bi-pencil" aria-hidden="true"></i></a><form th:action="@{/tasks/eliminar/{id}(id=${task.id})}" method="post" class="m-0"><button type="submit" class="btn-danger-ghost" th:attr="aria-label=${'Eliminar ' + task.name},title=${'Eliminar ' + task.name}" onclick="return confirm('¿Eliminar esta tarea?')"><i class="bi bi-trash" aria-hidden="true"></i></button></form></div></td></tr></tbody></table>
<p class="empty-state" data-empty th:hidden="${!#lists.isEmpty(tasks)}">Todavía no hay registros. Usá «Nueva tarea» para comenzar.</p></div>
<div data-create-panel class="create-panel"><h2 id="create-title">Nueva tarea</h2><form th:action="@{/tasks/guardar}" th:object="${nuevaTarea}" method="post" class="form-dark">
                            
                            <div class="mb-3">
                                <label for="create-field-1" class="form-label">Nombre de la tarea</label>
                                <input id="create-field-1" type="text" th:field="*{name}" class="form-control" placeholder="Ej: Limpiar vitrinas" required/>
                            </div>

                            <div class="mb-4">
                                <label for="create-field-2" class="form-label">Tipo de Tarea</label>
                                <select id="create-field-2" th:field="*{type}" data-task-type class="form-select" required>
                                    <option value="" disabled selected>-- Seleccionar tipo --</option>
                                    <option value="GENERAL">General (Todos pueden hacerla)</option>
                                    <option value="SPECIFIC">Específica (Requiere área autorizada)</option>
                                </select>
                            </div>

                            <div class="mb-4" id="areaSelectDiv" style="display: none;">
                                <label for="create-field-3" class="form-label">Área Autorizada</label>
                                <select id="create-field-3" name="areaId" data-task-area class="form-select">
                                    <option value="" disabled selected>-- Seleccionar área --</option>
                                    <option th:each="area : ${areas}" th:value="${area.id}" th:text="${area.nombre}"></option>
                                </select>
                                <div style="color: var(--text-muted); font-size: 11px; margin-top: 5px;">
                                    <i class="bi bi-info-circle"></i> Solo los empleados de esta área harán esta tarea.
                                </div>
                            </div>

                            <button type="submit" class="btn-primary-dark w-100 justify-content-center">
                                <i class="bi bi-check2-circle"></i> Guardar tarea
                            </button>
                        </form><button type="button" class="btn-ghost" data-close-create hidden>Cancelar</button></div>
<script th:src="@{/js/management.js}"></script>
</section></body></html>

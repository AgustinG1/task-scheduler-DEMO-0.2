# Conexión a la base de datos MySQL en producción.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Aplicar antes las migraciones manuales 001-004 con el servicio detenido.
# El arranque comprueba el esquema; nunca lo migra ni asigna propietarios.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false

# Render termina TLS y entrega HTTP al contenedor. Solo exponer este listener
# detras del proxy de la plataforma; sus cabeceras deben estar saneadas.
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.redirect-context-root=false
# Origen HTTPS sin barra final. No inferir destinos OIDC desde Host/Forwarded.
app.public-base-url=${APP_PUBLIC_URL}

spring.application.name=task-scheduler

# Perfil por defecto para despliegue.
spring.profiles.default=prod

# --- INSTRUCCIONES CRÍTICAS PARA AIVEN ---
# Ejecuta schema.sql siempre al arrancar
spring.sql.init.mode=always
# Hibernate espera a que schema.sql termine antes de actuar
spring.jpa.defer-datasource-initialization=true

# Configuración de Hibernate/JPA para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Comentado para evitar conflicto con schema.sql
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Formato de fecha para JPA
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
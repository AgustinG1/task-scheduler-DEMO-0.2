spring.application.name=task-scheduler

# Conexión a la base de datos Aiven MySQL en la nube
spring.datasource.url=jdbc:mysql://mysql-26d78475-task-scheduler0110.e.aivencloud.com:22513/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate/JPA para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Formato de fecha para JPA
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.application.name=personal-auth-demo
spring.profiles.default=auth0
server.address=127.0.0.1
server.port=8082
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=PERSONAL_AUTH_DEMO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# HTTP loopback only. A production consumer must use HTTPS and Secure cookies.
server.servlet.session.cookie.secure=false
